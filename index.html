<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#eef9ff" />
  <title>A Letter, Waiting</title>
  <style>
    :root {
      /* Skyglass: selected colour direction. */
      --ocean-950: #06384e;
      --ocean-800: #0b4963;
      --ocean-400: #70cbe0;
      --mist: #e9f8fb;
      --paper: #fffdf9;
      --ink: #0b4963;
      --pink-300: #f4b4ca;
      --pink-100: #ffe7ef;
      --glass: rgba(239, 252, 255, .30);
      --line: rgba(255,255,255,.78);
      --shadow: rgba(6, 56, 78, .22);
      --ease-out: cubic-bezier(.16, 1, .3, 1);
      --ease-spring: cubic-bezier(.2, 1.25, .38, 1);
    }

    * { box-sizing: border-box; }
    html { background: var(--mist); }
    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      overflow-x: hidden;
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(ellipse at 51% 48%, rgba(255,253,249,.96) 0, rgba(255,253,249,.52) 22%, transparent 52%),
        radial-gradient(circle at 83% 12%, rgba(244,180,202,.68), transparent 29rem),
        radial-gradient(circle at 11% 88%, rgba(112,203,224,.42), transparent 31rem),
        linear-gradient(145deg, #fff8fa 0%, #e9f8fb 49%, #fdebf1 100%);
    }

    .experience {
      position: relative;
      min-height: 100svh;
      isolation: isolate;
      display: grid;
      grid-template-rows: 1fr;
      padding: clamp(1.25rem, 3vw, 2.7rem);
      overflow: hidden;
    }

    /* Slow revolving colour wash: the page itself moves like the glass transition. */
    .color-revolve {
      pointer-events: none;
      position: absolute;
      z-index: -1;
      width: 126vmax;
      aspect-ratio: 1;
      left: 50%;
      top: 50%;
      border-radius: 50%;
      background: conic-gradient(
        from 8deg,
        transparent 0deg 28deg,
        rgba(112,203,224,.25) 64deg,
        rgba(255,255,255,.12) 112deg,
        rgba(244,180,202,.27) 166deg,
        transparent 220deg,
        rgba(112,203,224,.19) 276deg,
        rgba(244,180,202,.18) 326deg,
        transparent 360deg
      );
      filter: blur(52px) saturate(120%);
      opacity: .72;
      transform: translate(-50%, -50%) rotate(0deg) scale(1.08);
      will-change: transform;
      transition: opacity 1s ease;
      animation: backgroundRevolve 34s linear infinite;
    }
    .color-revolve::before,
    .color-revolve::after {
      content: "";
      position: absolute;
      border-radius: inherit;
      inset: 15%;
      background: conic-gradient(
        from 190deg,
        transparent 0deg 45deg,
        rgba(244,180,202,.23) 95deg,
        rgba(255,255,255,.13) 145deg,
        transparent 206deg,
        rgba(112,203,224,.22) 271deg,
        transparent 330deg
      );
      filter: blur(40px);
      mix-blend-mode: screen;
      animation: backgroundCounterRevolve 23s linear infinite;
    }
    .color-revolve::after {
      inset: 30%;
      opacity: .86;
      filter: blur(28px);
      animation-duration: 16s;
      animation-direction: reverse;
    }
    @keyframes backgroundRevolve {
      to { transform: translate(-50%, -50%) rotate(360deg) scale(1.08); }
    }
    @keyframes backgroundCounterRevolve {
      to { transform: rotate(-360deg) scale(1.15); }
    }

    .noise {
      pointer-events: none;
      position: absolute;
      z-index: -1;
      inset: 0;
      opacity: .22;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.19'/%3E%3C/svg%3E");
      mix-blend-mode: soft-light;
    }

    .ambient-glow {
      pointer-events: none;
      position: absolute;
      z-index: -1;
      border-radius: 50%;
      filter: blur(20px);
      mix-blend-mode: soft-light;
      will-change: transform;
      animation: ambientFloat 18s ease-in-out infinite alternate;
    }
    .ambient-glow--rose { width: 32rem; height: 32rem; top: -16rem; right: -10rem; background: rgba(244,180,202,.76); }
    .ambient-glow--sea { width: 34rem; height: 34rem; left: -18rem; bottom: -20rem; background: rgba(112,203,224,.64); animation-delay: -7s; }
    .ambient-glow--ivory { width: 25rem; height: 25rem; left: 38%; top: 38%; background: rgba(255,252,245,.84); animation-delay: -12s; }
    @keyframes ambientFloat {
      to { transform: translate3d(2.4rem, -1.7rem, 0) scale(1.14); }
    }

    .orb {
      position: absolute;
      z-index: -1;
      border-radius: 999px;
      filter: blur(15px);
      mix-blend-mode: soft-light;
      opacity: .57;
      animation: drift 15s ease-in-out infinite alternate;
    }
    .orb--one { width: 25rem; height: 25rem; background: rgba(112,203,224,.34); left: -11rem; top: 21%; }
    .orb--two { width: 22rem; height: 22rem; background: rgba(244,180,202,.42); right: -7rem; bottom: -7rem; animation-delay: -5s; }
    .orb--three { width: 9rem; height: 9rem; background: rgba(255,255,255,.82); right: 19%; top: 13%; animation-delay: -9s; }
    @keyframes drift { to { transform: translate3d(32px, -28px, 0) scale(1.09); } }

    .stardust { pointer-events: none; position: absolute; z-index: 0; inset: 0; overflow: hidden; }
    .stardust i { position: absolute; display: block; width: .27rem; aspect-ratio: 1; border-radius: 50%; background: rgba(255,255,255,.9); box-shadow: 0 0 .85rem .14rem rgba(255,255,255,.74); opacity: .2; animation: twinkle 4.8s ease-in-out infinite; }
    .stardust i:nth-child(1) { left: 14%; top: 22%; animation-delay: -1s; }
    .stardust i:nth-child(2) { left: 25%; top: 73%; animation-delay: -3.3s; }
    .stardust i:nth-child(3) { left: 77%; top: 28%; animation-delay: -2.1s; }
    .stardust i:nth-child(4) { left: 91%; top: 62%; animation-delay: -4.2s; }
    .stardust i:nth-child(5) { left: 63%; top: 83%; animation-delay: -.6s; }
    .stardust i:nth-child(6) { left: 46%; top: 16%; animation-delay: -2.8s; }
    @keyframes twinkle { 45% { opacity: .78; transform: scale(1.7); } 100% { opacity: .2; } }

    /* A dense sakura stream crosses the scene from both sides in the site’s glass palette. */
    .petal-drift { pointer-events: none; position: absolute; z-index: 0; inset: 0; overflow: hidden; }
    .petal-drift i {
      --turn: 0deg;
      --duration: 18s;
      --dip: 2.2rem;
      --end: -.8rem;
      --petal-a: rgba(255,247,251,.98);
      --petal-b: rgba(244,180,202,.78);
      --petal-glow: rgba(244,180,202,.48);
      --petal-size: 1;
      --shine-delay: 0s;
      position: absolute;
      display: block;
      width: calc(1.14rem * var(--petal-size));
      height: calc(.76rem * var(--petal-size));
      border: 1px solid rgba(255,255,255,.50);
      border-radius: 92% 9% 89% 12% / 88% 12% 90% 10%;
      background:
        radial-gradient(ellipse at 26% 20%, rgba(255,255,255,1) 0 12%, transparent 34%),
        radial-gradient(ellipse at 70% 77%, rgba(255,255,255,.36), transparent 43%),
        linear-gradient(135deg, var(--petal-a), var(--petal-b));
      box-shadow: inset 0 1px rgba(255,255,255,.96), inset 0 -1px rgba(255,255,255,.20), 0 .3rem .9rem var(--petal-glow);
      opacity: 0;
      filter: saturate(128%) brightness(1.04);
      animation-duration: var(--duration);
      animation-timing-function: cubic-bezier(.36,.03,.35,1);
      animation-iteration-count: infinite;
    }
    .petal-drift i::before {
      content: "";
      position: absolute;
      width: 67%;
      height: 38%;
      left: 7%;
      top: 8%;
      border-radius: 50%;
      background: radial-gradient(ellipse, rgba(255,255,255,.92), rgba(255,255,255,.16) 56%, transparent 72%);
      filter: blur(.3px);
      opacity: .68;
      transform: rotate(-18deg);
      animation: petalHighlight 2.8s ease-in-out var(--shine-delay) infinite;
    }
    .petal-drift i::after {
      content: "";
      position: absolute;
      width: 58%;
      height: 1px;
      left: 18%;
      top: 59%;
      border-radius: 50%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.86), var(--petal-glow), transparent);
      box-shadow: 0 0 .28rem var(--petal-glow);
      transform: rotate(-21deg);
      opacity: .8;
    }
    .petal-drift i:nth-child(odd) { left: -3rem; animation-name: sakuraSweepRight; }
    .petal-drift i:nth-child(even) { right: -3rem; animation-name: sakuraSweepLeft; }
    .petal-drift i:nth-child(4n+1) { --petal-a: rgba(255,245,250,.98); --petal-b: rgba(244,180,202,.82); --petal-glow: rgba(244,180,202,.58); }
    .petal-drift i:nth-child(4n+2) { --petal-a: rgba(234,250,253,.98); --petal-b: rgba(112,203,224,.80); --petal-glow: rgba(112,203,224,.52); }
    .petal-drift i:nth-child(4n+3) { --petal-a: rgba(255,255,255,.99); --petal-b: rgba(228,245,248,.84); --petal-glow: rgba(255,255,255,.52); }
    .petal-drift i:nth-child(4n) { --petal-a: rgba(255,239,247,.98); --petal-b: rgba(158,216,229,.76); --petal-glow: rgba(190,207,238,.50); }
    .petal-drift i:nth-child(3n) { --petal-size: 1.30; }
    .petal-drift i:nth-child(5n) { --petal-size: 1.16; }
    .petal-drift i:nth-child(7n) { --petal-size: 1.43; }
    .petal-drift i:nth-child(3n+1) { --shine-delay: -.6s; }
    .petal-drift i:nth-child(3n+2) { --shine-delay: -1.45s; }
    .petal-drift i:nth-child(3n) { --shine-delay: -2.15s; }
    .petal-drift i:nth-child(1) { top: 8%; --turn: 26deg; --duration: 17s; animation-delay: -3s; }
    .petal-drift i:nth-child(2) { top: 18%; --turn: 148deg; --duration: 20s; animation-delay: -11s; --dip: -2rem; }
    .petal-drift i:nth-child(3) { top: 29%; --turn: 210deg; --duration: 18s; animation-delay: -6s; }
    .petal-drift i:nth-child(4) { top: 41%; --turn: 315deg; --duration: 22s; animation-delay: -16s; --dip: -1.3rem; }
    .petal-drift i:nth-child(5) { top: 53%; --turn: 88deg; --duration: 19s; animation-delay: -9s; }
    .petal-drift i:nth-child(6) { top: 66%; --turn: 68deg; --duration: 21s; animation-delay: -14s; --dip: -2.4rem; }
    .petal-drift i:nth-child(7) { top: 78%; --turn: 172deg; --duration: 18s; animation-delay: -4s; }
    .petal-drift i:nth-child(8) { top: 89%; --turn: 332deg; --duration: 24s; animation-delay: -19s; --dip: -1.5rem; }
    .petal-drift i:nth-child(9) { top: 14%; --turn: 119deg; --duration: 20s; animation-delay: -12s; }
    .petal-drift i:nth-child(10) { top: 25%; --turn: 248deg; --duration: 23s; animation-delay: -8s; --dip: -2rem; }
    .petal-drift i:nth-child(11) { top: 37%; --turn: 42deg; --duration: 17s; animation-delay: -15s; }
    .petal-drift i:nth-child(12) { top: 48%; --turn: 292deg; --duration: 21s; animation-delay: -2s; --dip: -1.7rem; }
    .petal-drift i:nth-child(13) { top: 60%; --turn: 156deg; --duration: 19s; animation-delay: -10s; }
    .petal-drift i:nth-child(14) { top: 71%; --turn: 74deg; --duration: 22s; animation-delay: -17s; --dip: -2.1rem; }
    .petal-drift i:nth-child(15) { top: 84%; --turn: 228deg; --duration: 20s; animation-delay: -5s; }
    .petal-drift i:nth-child(16) { top: 6%; --turn: 346deg; --duration: 24s; animation-delay: -21s; --dip: -1.1rem; }
    .petal-drift i:nth-child(17) { top: 22%; --turn: 97deg; --duration: 18s; animation-delay: -7s; }
    .petal-drift i:nth-child(18) { top: 34%; --turn: 185deg; --duration: 21s; animation-delay: -13s; --dip: -2.2rem; }
    .petal-drift i:nth-child(19) { top: 46%; --turn: 283deg; --duration: 17s; animation-delay: -1s; }
    .petal-drift i:nth-child(20) { top: 58%; --turn: 18deg; --duration: 23s; animation-delay: -18s; --dip: -1.4rem; }
    .petal-drift i:nth-child(21) { top: 70%; --turn: 137deg; --duration: 19s; animation-delay: -8s; }
    .petal-drift i:nth-child(22) { top: 81%; --turn: 257deg; --duration: 22s; animation-delay: -15s; --dip: -2.6rem; }
    .petal-drift i:nth-child(23) { top: 93%; --turn: 62deg; --duration: 20s; animation-delay: -4s; }
    .petal-drift i:nth-child(24) { top: 11%; --turn: 318deg; --duration: 24s; animation-delay: -20s; --dip: -1.6rem; }
    @keyframes sakuraSweepRight {
      0% { opacity: 0; transform: translate3d(-1rem, -1rem, 0) rotate(var(--turn)) scale(.75); }
      12% { opacity: .74; }
      54% { transform: translate3d(52vw, var(--dip), 0) rotate(calc(var(--turn) + 132deg)) scale(1); }
      87% { opacity: .62; }
      100% { opacity: 0; transform: translate3d(112vw, var(--end), 0) rotate(calc(var(--turn) + 255deg)) scale(.84); }
    }
    @keyframes sakuraSweepLeft {
      0% { opacity: 0; transform: translate3d(1rem, -1rem, 0) rotate(var(--turn)) scale(.75); }
      12% { opacity: .74; }
      54% { transform: translate3d(-52vw, var(--dip), 0) rotate(calc(var(--turn) - 132deg)) scale(1); }
      87% { opacity: .62; }
      100% { opacity: 0; transform: translate3d(-112vw, var(--end), 0) rotate(calc(var(--turn) - 255deg)) scale(.84); }
    }
    @keyframes petalHighlight {
      0%, 100% { opacity: .36; filter: blur(.3px); }
      48% { opacity: 1; filter: blur(0); }
    }

    .stage {
      position: relative;
      z-index: 1;
      display: grid;
      place-items: center;
      min-height: min(43rem, 76vh);
      perspective: 1250px;
    }
    /* A soft moonlit halo and reflected light make the envelope feel like a small keepsake. */
    .stage::before {
      content: "";
      position: absolute;
      z-index: -1;
      width: min(50rem, 94vw);
      aspect-ratio: 1;
      left: 50%;
      top: 47%;
      border-radius: 50%;
      background:
        radial-gradient(circle at 50% 47%, rgba(255,255,255,.86) 0 4%, rgba(255,255,255,.43) 21%, rgba(244,180,202,.15) 43%, rgba(112,203,224,.10) 59%, transparent 72%);
      filter: blur(3px);
      transform: translate(-50%, -50%) scale(.83);
      opacity: .86;
      animation: auraBreathe 9s ease-in-out infinite alternate;
    }
    .stage::after {
      content: "";
      position: absolute;
      z-index: -1;
      width: min(39rem, 82vw);
      height: 6.5rem;
      left: 50%;
      bottom: 7%;
      border-radius: 50%;
      background: radial-gradient(ellipse, rgba(11,73,99,.16), rgba(112,203,224,.09) 39%, transparent 72%);
      filter: blur(12px);
      transform: translateX(-50%);
      opacity: .62;
      animation: reflectionBreathe 8s ease-in-out infinite alternate;
    }
    @keyframes auraBreathe { to { opacity: 1; transform: translate(-50%, -50%) scale(.91); } }
    @keyframes reflectionBreathe { to { opacity: .83; transform: translateX(-50%) scaleX(1.08); } }

    .intro { 
      position: absolute;
      top: clamp(2rem, 8vh, 5.5rem);
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      width: min(95%, 42rem);
      transition: opacity .65s ease, transform .65s var(--ease-out);
      pointer-events: none;
    }
    .eyebrow {
      margin: 0 0 .7rem;
      font-size: .67rem;
      font-weight: 800;
      letter-spacing: .2em;
      text-transform: uppercase;
      opacity: .62;
    }
    h1 {
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(2.25rem, 4.5vw, 4.5rem);
      font-weight: 400;
      letter-spacing: -.055em;
      line-height: .95;
      margin: 0;
    }
    .intro-copy {
      margin: 1rem auto 0;
      max-width: 31rem;
      line-height: 1.6;
      font-size: clamp(.86rem, 1.15vw, 1rem);
      opacity: .67;
    }

    .envelope-button {
      --w: min(72vw, 27rem);
      appearance: none;
      position: relative;
      width: var(--w);
      height: calc(var(--w) * .68);
      padding: 0;
      border: 0;
      background: transparent;
      cursor: pointer;
      isolation: isolate;
      transform-style: preserve-3d;
      -webkit-tap-highlight-color: transparent;
      outline: none;
    }
    .envelope-button:focus-visible .envelope-wrap {
      outline: 2px solid var(--ocean-800);
      outline-offset: 14px;
    }

    /* Two transparent elliptical orbits make the envelope feel suspended in glass light. */
    .glass-orbit {
      pointer-events: none;
      position: absolute;
      z-index: 0;
      left: 50%;
      top: 50%;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,.30);
      opacity: .82;
      filter: drop-shadow(0 0 .55rem rgba(255,255,255,.44));
      transform: translate(-50%, -50%) rotate(0deg);
      transform-origin: center;
      will-change: transform;
      scale: 1;
      transition: opacity .7s ease, scale 1.05s var(--ease-out);
    }
    .glass-orbit::before, .glass-orbit::after {
      content: "";
      position: absolute;
      display: block;
      border-radius: 99px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.98), rgba(112,203,224,.72), transparent);
      box-shadow: 0 0 .45rem rgba(255,255,255,.72);
    }
    .glass-orbit::before { width: 22%; height: 2px; left: 13%; top: -1px; }
    .glass-orbit::after { width: 15%; height: 2px; right: 8%; bottom: -1px; opacity: .8; background: linear-gradient(90deg, transparent, rgba(244,180,202,.82), rgba(255,255,255,.92), transparent); }
    .glass-orbit--outer {
      width: 132%;
      height: 164%;
      box-shadow: inset 0 0 1rem rgba(112,203,224,.06), 0 0 1.3rem rgba(244,180,202,.13);
      animation: glassOrbitOuter 12s linear infinite;
    }
    .glass-orbit--inner {
      width: 116%;
      height: 141%;
      border-color: rgba(244,180,202,.24);
      box-shadow: inset 0 0 1.1rem rgba(244,180,202,.07), 0 0 .9rem rgba(112,203,224,.12);
      opacity: .58;
      animation: glassOrbitInner 8.5s linear infinite;
    }
    .glass-orbit--inner::before { left: 62%; top: -1px; width: 18%; }
    .glass-orbit--inner::after { right: 60%; bottom: -1px; width: 16%; }
    @keyframes glassOrbitOuter { to { transform: translate(-50%, -50%) rotate(360deg); } }
    @keyframes glassOrbitInner { to { transform: translate(-50%, -50%) rotate(-360deg); } }

    .halo {
      position: absolute;
      width: 126%;
      aspect-ratio: 1;
      left: -13%;
      top: -24%;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,255,255,.87) 0, rgba(255,255,255,.31) 29%, transparent 68%);
      filter: blur(8px);
      transform: translateZ(-30px) scale(.85);
      opacity: .62;
      transition: transform 1.4s var(--ease-out), opacity .8s ease;
    }

    .envelope-wrap {
      position: absolute;
      z-index: 1;
      inset: 0;
      transform-style: preserve-3d;
      filter: drop-shadow(0 2.1rem 1.85rem rgba(8, 53, 76, .18));
      transition: transform 1.1s var(--ease-spring), filter .8s ease;
    }
    .envelope-wrap::before {
      content: "";
      position: absolute;
      inset: -5%;
      z-index: -2;
      border-radius: 50%;
      background: radial-gradient(ellipse at center, rgba(255,255,255,.8), transparent 65%);
      filter: blur(17px);
      opacity: .78;
      transform: scale(1);
      transition: opacity .6s ease, transform .8s var(--ease-out);
    }
    .envelope-wrap::after {
      content: "";
      position: absolute;
      z-index: 12;
      left: 7%;
      top: 6%;
      width: 26%;
      height: 3px;
      border-radius: 50%;
      transform: rotate(-23deg);
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.95), transparent);
      opacity: .77;
      transition: transform 1s var(--ease-out), opacity .5s ease;
    }

    .envelope {
      position: absolute;
      inset: 0;
      transform-style: preserve-3d;
      transition: opacity .75s ease, transform 1s var(--ease-out);
    }
    .back-panel, .front-panel, .flap, .fold, .rim {
      position: absolute;
      inset: 0;
      border: 1px solid var(--line);
      overflow: hidden;
      backface-visibility: hidden;
    }
    .back-panel {
      z-index: 1;
      border-radius: .55rem;
      background:
        linear-gradient(145deg, rgba(255,255,255,.64), rgba(207,243,250,.17) 38%, rgba(247,181,207,.18)),
        rgba(211,242,248,.22);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.92), inset 0 0 0 1px rgba(56,140,168,.07);
      backdrop-filter: blur(10px) saturate(125%);
      transition: opacity .72s ease, transform 1s var(--ease-out);
    }
    .back-panel::before {
      content: "";
      position: absolute;
      width: 70%; height: 160%;
      top: -28%; left: -50%;
      transform: rotate(22deg);
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.64), transparent);
      animation: slowSheen 9s ease-in-out infinite;
    }
    @keyframes slowSheen { 50% { transform: translateX(170%) rotate(22deg); } }

    /* A faint watercolour liner gives the clear envelope depth without hiding the paper. */
    .inner-liner {
      position: absolute;
      z-index: 2;
      inset: .48rem;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.48);
      border-radius: .34rem;
      background:
        radial-gradient(circle at 19% 87%, rgba(244,180,202,.36), transparent 29%),

    .letter-petal-layer i:nth-child(5) { left: 12%; bottom: 7%; --pturn: 300deg; animation-delay: -4s; }

    .scroll-cue {

    .letter::before {
      content: "";
      position: absolute;
      z-index: 0;
      inset: -18%;
      pointer-events: none;
      background: radial-gradient(circle at 50% 44%, rgba(255,255,255,.96), rgba(255,242,248,.38) 27%, transparent 64%);

    }
    .letter::after {
      content: "";
      position: absolute;
      z-index: 4;
      inset: 0;

      transform: translateX(-120%);
      transition: transform 1.2s var(--ease-out);
    }
    @keyframes paperBloom {
      0% { opacity: 0; transform: scale(.62); }
      32% { opacity: .84; transform: scale(1); }
      100% { opacity: 0; transform: scale(1.3); }
    }
    /* The paper is visible inside the clear envelope; its private message is not. */

      background: linear-gradient(90deg, transparent, var(--pink-300) 24%, var(--ocean-400) 52%, var(--pink-300) 78%, transparent);

    .letter-rule::after { content: "✦"; right: 13%; transform: translateY(-50%); color: rgba(112,203,224,.88); }
    .letter-mark {

    .front-panel {
      z-index: 5;

        radial-gradient(circle at 78% 13%, rgba(255,255,255,.76), transparent 22%),

    /* Iridescent edge work makes the envelope read as a crafted glass object. */
    .prism-rim {
      pointer-events: none;

      z-index: 6;
      inset: -.16rem;

    .glint {

    .glint--side { width: 14%; height: 2px; right: 2%; top: 49%; transform: rotate(78deg); opacity: .58; }

    .flap { 
      z-index: 7;

      height: 59%;

    /* A single pearl of light orbits the seal, inviting the first click. */
    .seal-orbit {
      pointer-events: none;
      position: absolute;
      z-index: 8;
      width: 5.4rem;

      content: "";
      position: absolute;
      width: .47rem;
      aspect-ratio: 1;
      left: calc(50% - .235rem);
      top: -.24rem;
      border-radius: 50%;

      box-shadow: 0 0 .45rem .14rem rgba(255,255,255,.9), 0 0 1.05rem .25rem rgba(244,180,202,.48);

    .seal-burst {

      transition: opacity .35s ease, transform .45s var(--ease-out);
    }
    .instruction-dot { width: .38rem; aspect-ratio: 1; border-radius: 50%; background: var(--pink-300); animation: breathe 1.8s ease-in-out infinite; }
    @keyframes breathe { 50% { transform: scale(1.75); opacity: .35; } }

    /* Sequence: the seal gathers light, releases, then the paper rises. */
    .is-unsealing .envelope-wrap {
      transform: translateY(-.4rem) rotateX(-2deg) scale(1.018);
      filter: drop-shadow(0 2.5rem 2.4rem rgba(8, 53, 76, .23));
    }
    .is-unsealing .glass-orbit { animation-duration: 1.15s; opacity: 1; scale: 1.06; }
    .is-unsealing .color-revolve { animation-duration: 7s; opacity: .93; }
    .is-unsealing .color-revolve::before { animation-duration: 4.6s; }
    .is-unsealing .color-revolve::after { animation-duration: 3.7s; }
    .is-unsealing .envelope-wrap::before { opacity: 1; transform: scale(1.24); }
    .is-unsealing .seal {
      transform: translateZ(30px) scale(1.14);
      box-shadow: 0 .55rem 1.25rem rgba(98,60,75,.26), 0 0 1.8rem rgba(255,255,255,.82), inset 0 1px rgba(255,255,255,.96), inset 0 0 .75rem rgba(255,255,255,.58);
    }
    .is-unsealing .seal-orbit {
      animation-duration: .72s;
      box-shadow: inset 0 0 .8rem rgba(112,203,224,.22), 0 0 1.9rem rgba(255,255,255,.72);
    }
    .is-unsealing .seal-burst { animation: sealBurst .85s var(--ease-out) both; }
    .is-unsealing .stage::before { animation: auraFlash 1.2s var(--ease-out) both; }
    @keyframes auraFlash {
      0% { opacity: .86; transform: translate(-50%, -50%) scale(.83); }
      38% { opacity: 1; transform: translate(-50%, -50%) scale(1.02); }
      100% { opacity: .9; transform: translate(-50%, -50%) scale(.91); }
    }

    .is-opening .intro { opacity: 0; transform: translate(-50%, -1.2rem); }
    .is-opening .glass-orbit { opacity: .34; scale: 1.16; }
    .is-opening .envelope-wrap { transform: translateY(1.3rem) rotateX(6deg) scale(.96); }
    .is-opening .halo { opacity: .9; transform: translateZ(-30px) scale(1.18); }
    .is-opening .flap { transform: translateZ(23px) rotateX(-178deg); }
    .is-opening .seal { transform: translateY(-1.25rem) rotate(28deg) scale(.67); opacity: 0; }
    .is-opening .seal-orbit { opacity: 0; animation-play-state: paused; }
    .is-opening .instruction { opacity: 0; transform: translate(-50%, .5rem); }

    /* The pocket releases only after the flap has started to lift. */
    .is-letter-out .letter-pocket { overflow: visible; z-index: 8; }
    .is-letter-out .letter { transform: translate3d(0, -31%, 80px) rotateX(0deg) scale(1.01); }
    .is-letter-out .letter::before { animation: paperBloom 1.25s var(--ease-out) both; }
    .is-letter-out .letter::after { transform: translateX(135%); }
    .is-letter-out .front-panel { opacity: .18; }

    .is-open .envelope-wrap {
      transform: translateZ(0) scale(1);
      filter: drop-shadow(0 1.3rem 1.5rem rgba(8,53,76,.1));
    }
    .is-open .glass-orbit { opacity: 0; scale: 1.32; }
    .is-open .color-revolve { animation-duration: 24s; opacity: .78; }
    .is-open .color-revolve::before { animation-duration: 17s; }
    .is-open .color-revolve::after { animation-duration: 12s; }
    .is-open .letter-pocket { overflow: visible; z-index: 13; }
    .is-open .back-panel { opacity: .31; transform: translateY(17%) scale(.78); }
    .is-open .inner-liner { opacity: .22; transform: translateY(17%) scale(.78); }
    .is-open .front-panel { opacity: .05; transform: translateY(17%) scale(.78); }
    .is-open .prism-rim { opacity: .24; transform: translateY(17%) scale(.78); }
    .is-open .glint { opacity: 0; }
    .is-open .letter {
      z-index: 13;
      width: min(124%, 34rem);
      height: min(165%, 26rem);
      left: -12%;
      top: -28%;
      padding: clamp(1.25rem, 4vw, 2.1rem);
      transform: translate3d(0, -2%, 215px) rotateX(0) scale(1);
      box-shadow: 0 2rem 4.7rem rgba(11, 66, 89, .22), inset 0 0 0 1px rgba(16,75,98,.12);
    }
    .is-open .letter-rule,
    .is-open .letter-mark,
    .is-open .letter h2 { opacity: 1; transform: translateY(0); }
    .is-open .letter p { opacity: .76; transform: translateY(0); }
    .is-open .letter h2 { font-size: clamp(1.5rem, 3.8vw, 3rem); }
    .is-open .instruction { opacity: 0; }

    @media (max-width: 520px) {
      .experience { padding: 1.25rem; }
      .stage { min-height: 37rem; }
      .intro { top: 3rem; }
      .envelope-button { --w: min(87vw, 24rem); }
      .instruction { bottom: -2.6rem; font-size: .59rem; }
      .is-open .letter { top: -22%; height: 150%; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; scroll-behavior: auto !important; }
    }
  </style>
</head>

  <script>
    const experience = document.getElementById('experience');
    const envelopeButton = document.getElementById('envelopeButton');
    const letterScroll = document.getElementById('letterScroll');
    let state = 'closed';

    function wait(callback, ms) {
      window.setTimeout(callback, ms);
    }

    function openLetter() {
      if (state !== 'closed') return;
      state = 'opening';
      envelopeButton.disabled = true;
      envelopeButton.setAttribute('aria-label', 'Unsealing letter');
      experience.classList.add('is-unsealing');

      // A cinematic three-beat sequence: charge the seal → lift the flap → release the note.
      wait(() => {
        experience.classList.add('is-opening');
        envelopeButton.setAttribute('aria-label', 'Opening letter');
      }, 420);
      wait(() => experience.classList.add('is-letter-out'), 860);
      wait(() => {
        experience.classList.add('is-open');
        letterScroll.scrollTop = 0;
        envelopeButton.setAttribute('aria-label', 'Letter open');
        envelopeButton.disabled = false;
        state = 'open';

        // A small automatic nudge shows that the opened letter can be read by scrolling.
        wait(() => {
          letterScroll.scrollTo({ top: 42, behavior: 'smooth' });
          wait(() => letterScroll.scrollTo({ top: 0, behavior: 'smooth' }), 900);
        }, 760);
      }, 1760);
    }

    envelopeButton.addEventListener('click', openLetter);
  </script>
